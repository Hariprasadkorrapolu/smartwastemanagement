{% extends "core/base.html" %}
{% block title %}Scan for Friend | Smart Waste{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <h1 class="h4 mb-3">Scan for Friend</h1>
                <p class="text-muted">The uploaded image will be analyzed immediately.</p>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-success" type="submit">Submit Friend Waste</button>
                    <a class="btn btn-outline-secondary" href="{% url 'home' %}">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
